name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ReelNotes-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelNotes-apk
          path: ReelNotes-${{ github.run_number }}.apk

      # A release gives a direct download link you can open on the phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelNotes build ${{ github.run_number }}
          body: Download the .apk below on your phone and install it (allow "install unknown apps" for your browser).
          files: ReelNotes-${{ github.run_number }}.apk
          make_latest: true
